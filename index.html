.timer{width:min(430px,88vw);padding:30px 28px 25px;border-radius:26px;
background:rgba(235,250,248,.10);border:1px solid rgba(255,255,255,.20);
box-shadow:0 12px 40px rgba(20,90,95,.18);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(3px);text-align:center}
.display{font-variant-numeric:tabular-nums;font-size:clamp(58px,13vw,92px);font-weight:600;letter-spacing:-3px;line-height:1;color:#f7ffff;text-shadow:0 2px 14px rgba(20,90,100,.35);margin:5px 0 24px}
.inputs{display:flex;justify-content:center;gap:8px;margin-bottom:15px}
input{width:82px;padding:10px 8px;border:1px solid rgba(255,255,255,.55);border-radius:11px;background:rgba(255,255,255,.42);color:#164d52;text-align:center;font-size:16px;outline:none}
button{border:1px solid rgba(255,255,255,.38);border-radius:12px;padding:11px 18px;margin:3px;font-size:15px;cursor:pointer;background:rgba(255,255,255,.75);color:#18545a;box-shadow:0 3px 12px rgba(30,100,105,.12)}
button:hover{background:rgba(255,255,255,.92)}button.secondary{background:rgba(255,255,255,.38);color:#174f55}
.presets{margin-top:13px}.presets button{font-size:13px;padding:8px 11px}
.status{min-height:20px;margin-top:12px;font-size:13px;color:#eaffff;text-shadow:0 1px 5px rgba(20,80,85,.45)}
body.finished .timer{animation:pulse .8s ease-in-out 3}@keyframes pulse{50%{transform:scale(1.025)}}
</style>
</head>
<body>
<div class="timer">
<div id="display" class="display">25:00</div>
<div class="inputs"><input id="minutes" type="number" min="0" max="60" value="25"><input id="seconds" type="number" min="0" max="59" value="0"></div>
<div><button id="start">Start</button><button id="pause" class="secondary">Pause</button><button id="reset" class="secondary">Reset</button></div>
<div class="presets"><button class="secondary" data-min="5">5 min</button><button class="secondary" data-min="10">10 min</button><button class="secondary" data-min="25">25 min</button><button class="secondary" data-min="45">45 min</button><button class="secondary" data-min="60">60 min</button></div>
<div id="status" class="status"></div>
</div>
<script>
let remaining=1500,interval=null,running=false;
const d=document.getElementById("display"),mi=document.getElementById("minutes"),se=document.getElementById("seconds"),st=document.getElementById("status");
function fmt(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function show(){d.textContent=fmt(remaining);document.title=fmt(remaining)+" — Timer"}
function get(){let m=Math.max(0,Math.min(60,Number(mi.value)||0)),s=Math.max(0,Math.min(59,Number(se.value)||0));if(m===60)s=0;mi.value=m;se.value=s;return m*60+s}
function set(x){pause();remaining=x;mi.value=Math.floor(x/60);se.value=x%60;st.textContent="";document.body.classList.remove("finished");show()}
function start(){if(running)return;if(remaining<=0)remaining=get();if(!remaining)return;running=true;st.textContent="Running";interval=setInterval(()=>{remaining--;show();if(remaining<=0){clearInterval(interval);interval=null;running=false;st.textContent="Time's up!";document.body.classList.add("finished");beep()}},1000)}
function pause(){if(interval)clearInterval(interval);interval=null;running=false;if(remaining>0)st.textContent="Paused"}
function reset(){pause();remaining=get();st.textContent="";document.body.classList.remove("finished");show()}
function beep(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.25)}catch(e){}}
document.getElementById("start").onclick=start;document.getElementById("pause").onclick=pause;document.getElementById("reset").onclick=reset;
[mi,se].forEach(x=>x.addEventListener("change",reset));document.querySelectorAll("[data-min]").forEach(x=>x.onclick=()=>set(Number(x.dataset.min)*60));show();
</script>
</body>
</html>
